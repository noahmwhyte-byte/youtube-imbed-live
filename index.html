<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loop</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  /* Transparent layer blocks hover controls/overlays so it stays a clean loop */
  .shield { position: fixed; inset: 0; z-index: 2; }
</style>
</head>
<body>
  <!-- loop=1 needs playlist=<same video id> to repeat a single video -->
  <iframe
    src="https://www.youtube.com/embed/bEoa2GjmPUk?autoplay=1&mute=1&loop=1&playlist=bEoa2GjmPUk&controls=0&rel=0&modestbranding=1&playsinline=1&iv_load_policy=3&disablekb=1"
    allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
    allowfullscreen
    title="Looping video"></iframe>
  <div class="shield" id="shield"></div>

  <script>
    // Browsers require a user gesture for real fullscreen: click anywhere to enter it.
    document.getElementById('shield').addEventListener('click', function () {
      var el = document.documentElement;
      if (!document.fullscreenElement) {
        (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      }
    });
  </script>
</body>
</html>
